<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Reham ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:"Cairo",sans-serif;
  color:#fff;
  overflow-x:hidden;
  background:
    linear-gradient(rgba(10,5,12,.72),rgba(10,5,12,.90)),
    url("./1000150926.jpg") center/cover fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,120,160,.15),transparent 30%),
    radial-gradient(circle at 80% 70%,rgba(180,80,160,.12),transparent 30%);
  pointer-events:none;
  z-index:-1;
}

.container{
  width:min(1000px,92%);
  margin:auto;
  padding:25px 0 60px;
}

header{
  text-align:center;
  padding:30px 10px;
}

.heart{
  font-size:48px;
  animation:pulse 1.8s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.15)}
}

h1{
  font-family:"Amiri",serif;
  font-size:clamp(40px,9vw,72px);
  margin:8px 0;
}

.subtitle{
  color:#e8cbd5;
}

.book{
  width:min(850px,100%);
  margin:auto;
  perspective:1800px;
}

.page{
  display:none;
  min-height:570px;
  padding:45px;
  border-radius:22px;
  background:rgba(25,15,24,.88);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  backdrop-filter:blur(15px);
  animation:appear .5s ease;
}

.page.active{
  display:block;
}

@keyframes appear{
  from{
    opacity:0;
    transform:rotateY(-8deg) translateY(10px);
  }
  to{
    opacity:1;
    transform:rotateY(0) translateY(0);
  }
}

.page-number{
  color:#dca8ba;
  margin-bottom:12px;
  font-size:14px;
}

.page h2{
  font-family:"Amiri",serif;
  font-size:40px;
  color:#f5d7e0;
  margin-bottom:20px;
}

.page p{
  line-height:2.1;
  color:#eee;
  font-size:17px;
}

.quote{
  margin:25
